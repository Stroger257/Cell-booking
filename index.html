<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>细胞房预约系统</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root {
  --bg:#f8f7f4; --surface:#fff; --surface2:#f2f0ec; --border:#e0ddd7;
  --text:#1a1916; --text2:#6b6860; --text3:#9e9b95;
  --blue:#2563eb; --blue-light:#dbeafe; --blue-dark:#1d4ed8;
  --green:#16a34a; --green-light:#dcfce7;
  --red:#dc2626; --red-light:#fee2e2;
  --amber:#d97706; --amber-light:#fef3c7;
  --radius:8px; --radius-lg:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh;
}
.layout{display:flex;min-height:100vh}
.sidebar{
  width:220px;background:var(--surface);border-right:1px solid var(--border);
  padding:1.5rem 1rem;flex-shrink:0;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;
}
.main{flex:1;padding:1.5rem;overflow-x:hidden}
.logo{
  display:flex;align-items:center;gap:8px;padding:0 .5rem 1.5rem;
  border-bottom:1px solid var(--border);margin-bottom:.5rem;
}
.logo-icon{
  width:32px;height:32px;background:var(--blue);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;color:white;font-size:16px;
}
.logo-text{font-size:14px;font-weight:600;line-height:1.3}
.logo-text span{display:block;font-size:11px;font-weight:400;color:var(--text2)}
.nav-btn{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius);
  border:none;background:transparent;cursor:pointer;font-size:13px;color:var(--text2);
  width:100%;text-align:left;transition:.15s;
}
.nav-btn:hover{background:var(--surface2);color:var(--text)}
.nav-btn.active{background:var(--blue-light);color:var(--blue);font-weight:500}
.nav-btn .icon{width:18px;text-align:center;font-size:16px}
.nav-divider{height:1px;background:var(--border);margin:8px 0}
.name-section{margin-top:auto;padding-top:1rem;border-top:1px solid var(--border)}
.name-label{font-size:11px;color:var(--text3);margin-bottom:6px}
.name-input{
  width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius);
  font-size:13px;background:var(--surface);color:var(--text);outline:none;
}
.name-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}

.section{display:none}
.section.visible{display:block}
.page-title{font-size:18px;font-weight:600;margin-bottom:.25rem}
.page-sub{font-size:13px;color:var(--text2);margin-bottom:1.5rem}

.date-bar{display:flex;align-items:center;gap:10px;margin-bottom:1rem;flex-wrap:wrap}
.date-btn{
  padding:6px 14px;border:1px solid var(--border);border-radius:var(--radius);
  background:var(--surface);cursor:pointer;font-size:13px;color:var(--text);
}
.date-btn:hover{border-color:var(--blue);color:var(--blue)}
.date-btn:disabled{opacity:.4;cursor:not-allowed}
.date-display{font-size:15px;font-weight:600}
.date-tag{
  font-size:12px;background:var(--blue-light);color:var(--blue);
  padding:2px 8px;border-radius:20px;margin-left:6px;
}
.legend{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.lg{width:16px;height:16px;border-radius:4px}

.mobile-book-wrap{display:flex;flex-direction:column;gap:12px}
.bench-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:12px;box-shadow:var(--shadow);
}
.bench-title{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;font-weight:600;font-size:15px;
}
.bench-title em{
  font-style:normal;font-size:12px;color:var(--text2);background:var(--surface2);
  padding:2px 8px;border-radius:999px;
}
.slot-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.slot-btn{
  width:100%;min-height:48px;padding:6px 4px;border-radius:8px;font-size:12px;
  border:none;cursor:pointer;transition:.12s;text-align:center;line-height:1.4;
}
.slot-free{background:var(--surface2);color:var(--text2)}
.slot-free:hover{background:var(--blue-light);color:var(--blue)}
.slot-mine{background:var(--blue-light);color:var(--blue);font-weight:600}
.slot-taken{background:var(--surface2);color:var(--text3);cursor:not-allowed;opacity:.6}
.slot-conflict{background:var(--amber-light);color:var(--amber);cursor:not-allowed}
.slot-noname{background:transparent;color:var(--text3);cursor:default;border:1px dashed var(--border)}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:1rem 1.25rem;margin-bottom:10px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;box-shadow:var(--shadow);
}
.card-info{font-size:13px}
.card-date{font-weight:600;margin-right:10px}
.card-meta{color:var(--text2);font-size:12px}
.cancel-btn{
  padding:5px 14px;border:1px solid var(--red);border-radius:var(--radius);
  color:var(--red);background:transparent;cursor:pointer;font-size:12px;white-space:nowrap;
}
.cancel-btn:hover{background:var(--red-light)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:1.5rem}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow)}
.stat-val{font-size:26px;font-weight:700;line-height:1}
.stat-label{font-size:12px;color:var(--text2);margin-top:4px}

.login-box{
  max-width:360px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:2rem;box-shadow:var(--shadow);
}
.login-box h2{font-size:16px;margin-bottom:1rem}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--text2);margin-bottom:5px;display:block}
.form-input{
  width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);
  font-size:13px;background:var(--surface);color:var(--text);outline:none;
}
.form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}

.admin-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-select{
  padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);
  font-size:12px;background:var(--surface);color:var(--text);outline:none;
}
.admin-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}
.admin-table{width:100%;border-collapse:collapse;font-size:13px;min-width:540px}
.admin-table th{
  padding:10px 14px;text-align:left;font-size:12px;font-weight:500;
  background:var(--surface2);border-bottom:2px solid var(--border);
}
.admin-table td{padding:9px 14px;border-bottom:1px solid var(--border)}
.admin-table tr:hover td{background:var(--surface2)}

.btn{
  padding:7px 16px;border-radius:var(--radius);font-size:13px;cursor:pointer;
  border:1px solid;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn-primary{background:var(--blue);color:white;border-color:var(--blue-dark)}
.btn-primary:hover{background:var(--blue-dark)}
.btn-outline{background:var(--surface);color:var(--text);border-color:var(--border)}
.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-green{background:var(--green);color:white;border-color:#15803d}
.btn-green:hover{background:#15803d}
.btn-danger{background:var(--red);color:white;border-color:#b91c1c}
.btn-danger:hover{background:#b91c1c}

.toast{
  position:fixed;bottom:24px;right:24px;padding:10px 18px;border-radius:var(--radius);
  font-size:13px;font-weight:500;z-index:9999;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.toast-success{background:var(--green-light);color:var(--green);border:1px solid #86efac}
.toast-error{background:var(--red-light);color:var(--red);border:1px solid #fca5a5}
.empty{text-align:center;padding:3rem;color:var(--text3);font-size:13px}
.empty-icon{font-size:32px;margin-bottom:8px}

@media (min-width:768px){
  .slot-list{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:640px){
  .layout{flex-direction:column}
  .sidebar{
    width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;
    align-items:center;padding:.75rem;gap:4px;
  }
  .logo{border-bottom:none;padding-bottom:0;margin-bottom:0;width:100%}
  .nav-btn{width:auto;flex:1;justify-content:center;padding:8px 6px}
  .nav-divider{display:none}
  .name-section{margin-top:0;padding-top:8px;border-top:1px solid var(--border);width:100%}
  .main{padding:1rem}
  .slot-list{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>
<div class="layout">
  <nav class="sidebar">
    <div class="logo">
      <div class="logo-icon">🧫</div>
      <div class="logo-text">细胞房预约<span>Cell Bench Booking</span></div>
    </div>

    <button class="nav-btn active" onclick="switchTab('book')" id="nav-book">
      <span class="icon">📅</span>预约
    </button>
    <button class="nav-btn" onclick="switchTab('mine')" id="nav-mine">
      <span class="icon">📋</span>我的
    </button>
    <button class="nav-btn" onclick="switchTab('admin')" id="nav-admin">
      <span class="icon">🔐</span>管理
    </button>

    <div class="name-section">
      <div class="name-label">当前用户</div>
      <input class="name-input" id="username" type="text" placeholder="请输入您的姓名" oninput="onNameChange()">
    </div>
  </nav>

  <main class="main">
    <div class="section visible" id="sec-book">
      <div class="page-title">预约细胞台</div>
      <div class="page-sub">点击空闲时间段预约；蓝色为您的预约，点击可取消</div>

      <div class="date-bar">
        <button class="date-btn" id="prev-btn" onclick="changeDay(-1)">‹ 前一天</button>
        <div>
          <span class="date-display" id="date-label"></span>
          <span class="date-tag" id="date-tag"></span>
        </div>
        <button class="date-btn" id="next-btn" onclick="changeDay(1)">后一天 ›</button>
        <button class="date-btn" onclick="manualRefresh()">刷新</button>
      </div>

      <div class="legend">
        <div class="legend-item"><div class="lg" style="background:#f2f0ec;border:1px solid #d4d2cc"></div>空闲</div>
        <div class="legend-item"><div class="lg" style="background:#dbeafe;border:1px solid #93c5fd"></div>我的预约</div>
        <div class="legend-item"><div class="lg" style="background:#f2f0ec;opacity:.5;border:1px dashed #d4d2cc"></div>他人预约</div>
        <div class="legend-item"><div class="lg" style="background:#fef3c7;border:1px solid #fcd34d"></div>时段冲突</div>
      </div>

      <div id="grid"></div>
    </div>

    <div class="section" id="sec-mine">
      <div class="page-title">我的预约</div>
      <div class="page-sub">显示您未来的预约记录</div>
      <div id="my-list"></div>
    </div>

    <div class="section" id="sec-admin">
      <div class="page-title">管理员面板</div>
      <div class="page-sub">查看、筛选、取消预约，导出 Excel</div>

      <div id="admin-login-box">
        <div class="login-box">
          <h2>🔐 管理员登录</h2>
          <div class="form-group">
            <label class="form-label">密码</label>
            <input class="form-input" id="admin-pass" type="password" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter')adminLogin()">
          </div>
          <button class="btn btn-primary" onclick="adminLogin()">登录</button>
        </div>
      </div>

      <div id="admin-panel" style="display:none">
        <div class="stats-grid" id="stats-grid"></div>

        <div class="admin-toolbar">
          <div class="filter-row">
            <select class="filter-select" id="filter-date" onchange="renderAdminTable()">
              <option value="">全部日期</option>
            </select>
            <select class="filter-select" id="filter-bench" onchange="renderAdminTable()">
              <option value="">全部台位</option>
            </select>
            <select class="filter-select" id="filter-user" onchange="renderAdminTable()">
              <option value="">全部用户</option>
            </select>
          </div>
          <button class="btn btn-green" onclick="exportExcel()">📥 导出 Excel</button>
          <button class="btn btn-outline" onclick="manualRefresh()">刷新</button>
          <button class="btn btn-outline" onclick="adminLogout()">退出</button>
        </div>

        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>日期</th><th>时间段</th><th>区域</th><th>台位</th><th>预约人</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="admin-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// 配置区
// ============================================================
const JSONBIN_BIN_ID = '6a2007e3da38895dfe805a3f';
const JSONBIN_API_KEY = '$2a$10$PtHRo4NP.VHJFlMzK6St0Ok2yvRYIcBaPCP.kaHA7fopkzGKHEbIK';
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

const ADMIN_PASSWORD = 'admin888';
const MAX_AHEAD_DAYS = 3;

const BENCHES = [
  { id:'E1', name:'东区1号', zone:'东区' },
  { id:'E2', name:'东区2号', zone:'东区' },
  { id:'W1', name:'西区1号', zone:'西区' },
  { id:'W2', name:'西区2号', zone:'西区' },
  { id:'W3', name:'西区3号', zone:'西区' },
  { id:'W4', name:'西区4号', zone:'西区' },
];

// 预约时间段，可自行调整
const TIME_SLOTS = [
  '08:00-09:00',
  '09:00-10:00',
  '10:00-11:00',
  '11:00-12:00',
  '12:00-13:00',
  '13:00-14:00',
  '14:00-15:00',
  '15:00-16:00',
  '16:00-17:00',
  '17:00-18:00',
  '18:00-19:00',
  '19:00-20:00',
  '20:00-21:00',
  '21:00-22:00'
];
// ============================================================

let currentOffset = 0;
let bookings = {};
let adminLogged = false;
let isSaving = false;
const DAY_TAGS = ['今天','明天','后天','大后天'];

function getDateStr(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0,10);
}
function getTodayStr(){ return getDateStr(0); }
function getTimeSlots(){ return TIME_SLOTS; }

function getUser(){ return document.getElementById('username').value.trim(); }

function showToast(msg,type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast toast-${type}`;
  t.style.display = 'block';
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>t.style.display='none',2600);
}

function cleanOldBookings(){
  const today = getTodayStr();
  Object.keys(bookings).forEach(date=>{
    if(date < today) delete bookings[date];
  });
}

async function load(){
  try{
    const res = await fetch(`${JSONBIN_URL}/latest`, {
      method:'GET',
      headers:{ 'X-Master-Key': JSONBIN_API_KEY }
    });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();
    bookings = data.record?.bookings || {};
    cleanOldBookings();
  }catch(e){
    console.error(e);
    bookings = {};
    showToast('云端数据读取失败，请检查网络或 Key', 'error');
  }
}

async function save(){
  if(isSaving) return;
  isSaving = true;
  try{
    cleanOldBookings();
    const payload = {
      bookings,
      updatedAt: new Date().toISOString()
    };

    const res = await fetch(JSONBIN_URL, {
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        'X-Master-Key': JSONBIN_API_KEY
      },
      body: JSON.stringify(payload)
    });

    if(!res.ok) throw new Error(`HTTP ${res.status}`);
  }catch(e){
    console.error(e);
    showToast('云端保存失败，请稍后重试', 'error');
  }finally{
    isSaving = false;
  }
}

async function manualRefresh(){
  await load();
  renderGrid();
  renderMine();
  if(adminLogged) renderAdminPanel();
  showToast('已刷新云端数据');
}

function switchTab(name){
  ['book','mine','admin'].forEach(n=>{
    document.getElementById('sec-'+n).classList.toggle('visible', n===name);
    document.getElementById('nav-'+n).classList.toggle('active', n===name);
  });
  if(name==='mine') renderMine();
  if(name==='admin') renderAdminIfLogged();
}

function onNameChange(){
  localStorage.setItem('cell_booking_username', getUser());
  renderGrid();
  renderMine();
}

function changeDay(d){
  const nxt = currentOffset + d;
  if(nxt < 0 || nxt > MAX_AHEAD_DAYS) return;
  currentOffset = nxt;
  renderGrid();
}

function checkConflict(dateStr, slot, skipBenchId, user){
  const day = bookings[dateStr] || {};
  for(const b of BENCHES){
    if(b.id === skipBenchId) continue;
    if(day[`${b.id}__${slot}`] === user) return b.name;
  }
  return null;
}

async function book(dateStr, slot, benchId){
  const user = getUser();
  if(!user){ showToast('请先输入姓名', 'error'); return; }

  // 先重新读取云端，降低多人同时预约冲突
  await load();

  if(!bookings[dateStr]) bookings[dateStr] = {};
  const key = `${benchId}__${slot}`;

  if(bookings[dateStr][key]){
    showToast('该时段已被预约', 'error');
    renderGrid();
    return;
  }

  const conflict = checkConflict(dateStr, slot, benchId, user);
  if(conflict){
    showToast(`您在 ${slot} 已预约 ${conflict}，不能同一时段预约多台`, 'error');
    renderGrid();
    return;
  }

  bookings[dateStr][key] = user;
  await save();
  showToast('✅ 预约成功');
  renderGrid();
  renderMine();
}

async function cancel(dateStr, slot, benchId){
  const user = getUser();

  await load();

  const key = `${benchId}__${slot}`;
  if(!bookings[dateStr] || bookings[dateStr][key] !== user){
    showToast('只能取消自己的预约', 'error');
    renderGrid();
    return;
  }

  delete bookings[dateStr][key];
  await save();
  showToast('已取消预约');
  renderGrid();
  renderMine();
  if(adminLogged) renderAdminTable();
}

async function adminCancel(dateStr, benchId, slot){
  if(!confirm(`确定取消 ${dateStr} ${slot} ${benchId} 的预约？`)) return;

  await load();

  const key = `${benchId}__${slot}`;
  if(bookings[dateStr]) delete bookings[dateStr][key];

  await save();
  showToast('管理员已取消该预约');
  renderAdminPanel();
  renderGrid();
}

function renderGrid(){
  const dateStr = getDateStr(currentOffset);
  document.getElementById('date-label').textContent = dateStr;
  document.getElementById('date-tag').textContent = DAY_TAGS[currentOffset] || '';
  document.getElementById('prev-btn').disabled = currentOffset <= 0;
  document.getElementById('next-btn').disabled = currentOffset >= MAX_AHEAD_DAYS;

  const slots = getTimeSlots();
  const user = getUser();
  const day = bookings[dateStr] || {};

  let html = `<div class="mobile-book-wrap">`;

  BENCHES.forEach(b=>{
    html += `
      <div class="bench-card">
        <div class="bench-title">
          <span>${b.name}</span>
          <em>${b.zone}</em>
        </div>
        <div class="slot-list">
    `;

    slots.forEach(slot=>{
      const key = `${b.id}__${slot}`;
      const who = day[key];

      if(!who){
        if(!user){
          html += `<button class="slot-btn slot-noname">请输入姓名</button>`;
        }else{
          const conflict = checkConflict(dateStr, slot, b.id, user);
          if(conflict){
            html += `<button class="slot-btn slot-conflict" title="该时段已预约${conflict}">${slot}<br>冲突</button>`;
          }else{
            html += `<button class="slot-btn slot-free" onclick="book('${dateStr}','${slot}','${b.id}')">${slot}<br>预约</button>`;
          }
        }
      }else if(who === user){
        html += `<button class="slot-btn slot-mine" onclick="cancel('${dateStr}','${slot}','${b.id}')">${slot}<br>我的预约</button>`;
      }else{
        html += `<button class="slot-btn slot-taken" disabled title="${who}">${slot}<br>${who.slice(0,3)}…</button>`;
      }
    });

    html += `
        </div>
      </div>
    `;
  });

  html += `</div>`;
  document.getElementById('grid').innerHTML = html;
}

function renderMine(){
  const user = getUser();
  const container = document.getElementById('my-list');

  if(!user){
    container.innerHTML = '<div class="empty"><div class="empty-icon">👤</div>请先输入姓名</div>';
    return;
  }

  const today = getTodayStr();
  const items = [];

  for(const [date, dayData] of Object.entries(bookings)){
    if(date < today) continue;
    for(const [key, who] of Object.entries(dayData)){
      if(who === user){
        const [benchId, slot] = key.split('__');
        const bench = BENCHES.find(b=>b.id===benchId);
        items.push({date, slot, bench, benchId});
      }
    }
  }

  items.sort((a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot));

  if(!items.length){
    container.innerHTML = '<div class="empty"><div class="empty-icon">📭</div>暂无预约记录</div>';
    return;
  }

  container.innerHTML = items.map(it=>`
    <div class="card">
      <div class="card-info">
        <span class="card-date">${it.date}</span>
        <span class="card-meta">${it.slot} | ${it.bench ? it.bench.zone + ' ' + it.bench.name : it.benchId}</span>
      </div>
      <button class="cancel-btn" onclick="cancel('${it.date}','${it.slot}','${it.benchId}')">取消</button>
    </div>
  `).join('');
}

function adminLogin(){
  const pass = document.getElementById('admin-pass').value;
  if(pass === ADMIN_PASSWORD){
    adminLogged = true;
    document.getElementById('admin-login-box').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'block';
    renderAdminPanel();
  }else{
    showToast('密码错误', 'error');
  }
}

function adminLogout(){
  adminLogged = false;
  document.getElementById('admin-login-box').style.display = 'block';
  document.getElementById('admin-panel').style.display = 'none';
  document.getElementById('admin-pass').value = '';
}

function renderAdminIfLogged(){
  if(adminLogged) renderAdminPanel();
}

function getAllItems(){
  const items = [];
  for(const [date, dayData] of Object.entries(bookings)){
    for(const [key, who] of Object.entries(dayData)){
      const [benchId, slot] = key.split('__');
      const bench = BENCHES.find(b=>b.id===benchId);
      items.push({date, slot, bench, benchId, who});
    }
  }
  return items.sort((a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot));
}

function renderAdminPanel(){
  const all = getAllItems();
  const today = getTodayStr();
  const futureCount = all.filter(i=>i.date >= today).length;
  const users = [...new Set(all.map(i=>i.who))];

  const benchCounts = {};
  all.forEach(i=>{
    const n = i.bench?.name || i.benchId;
    benchCounts[n] = (benchCounts[n] || 0) + 1;
  });
  const topBench = Object.entries(benchCounts).sort((a,b)=>b[1]-a[1])[0];

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="stat-val">${all.length}</div><div class="stat-label">📊 总预约次数</div></div>
    <div class="stat-card"><div class="stat-val">${users.length}</div><div class="stat-label">👥 预约人数</div></div>
    <div class="stat-card"><div class="stat-val">${futureCount}</div><div class="stat-label">📅 未来预约数</div></div>
    <div class="stat-card"><div class="stat-val" style="font-size:18px">${topBench ? topBench[0] : '—'}</div><div class="stat-label">🔥 最热门台位 ${topBench ? topBench[1] : 0}次</div></div>
  `;

  const dateSet = [...new Set(all.map(i=>i.date))].sort();
  const userSet = [...new Set(all.map(i=>i.who))].sort();

  const fdEl = document.getElementById('filter-date');
  const fuEl = document.getElementById('filter-user');
  const fbEl = document.getElementById('filter-bench');

  const curDate = fdEl.value;
  const curUser = fuEl.value;
  const curBench = fbEl.value;

  fdEl.innerHTML = '<option value="">全部日期</option>' +
    dateSet.map(d=>`<option value="${d}" ${d===curDate?'selected':''}>${d}</option>`).join('');

  fuEl.innerHTML = '<option value="">全部用户</option>' +
    userSet.map(u=>`<option value="${u}" ${u===curUser?'selected':''}>${u}</option>`).join('');

  fbEl.innerHTML = '<option value="">全部台位</option>' +
    BENCHES.map(b=>`<option value="${b.id}" ${b.id===curBench?'selected':''}>${b.zone} ${b.name}</option>`).join('');

  renderAdminTable();
}

function renderAdminTable(){
  const fDate = document.getElementById('filter-date').value;
  const fUser = document.getElementById('filter-user').value;
  const fBench = document.getElementById('filter-bench').value;

  let items = getAllItems();

  if(fDate) items = items.filter(i=>i.date===fDate);
  if(fUser) items = items.filter(i=>i.who===fUser);
  if(fBench) items = items.filter(i=>i.benchId===fBench);

  const tbody = document.getElementById('admin-tbody');

  if(!items.length){
    tbody.innerHTML = '<tr><td colspan="6" class="empty" style="padding:2rem">暂无预约记录</td></tr>';
    return;
  }

  tbody.innerHTML = items.map(it=>`
    <tr>
      <td>${it.date}</td>
      <td>${it.slot}</td>
      <td>${it.bench?.zone || ''}</td>
      <td>${it.bench?.name || it.benchId}</td>
      <td>${it.who}</td>
      <td><button class="cancel-btn" style="padding:3px 10px;font-size:11px" onclick="adminCancel('${it.date}','${it.benchId}','${it.slot}')">取消</button></td>
    </tr>
  `).join('');
}

function exportExcel(){
  const items = getAllItems();
  if(!items.length){
    showToast('暂无数据可导出', 'error');
    return;
  }

  const wb = XLSX.utils.book_new();

  const summaryRows = [['日期','时间段','区域','台位','预约人']];
  items.forEach(it=>{
    summaryRows.push([it.date, it.slot, it.bench?.zone || '', it.bench?.name || it.benchId, it.who]);
  });

  const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
  wsSummary['!cols'] = [{wch:12},{wch:14},{wch:8},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsSummary, '全部记录');

  BENCHES.forEach(b=>{
    const rows = [['日期','时间段','预约人']];
    items.filter(it=>it.benchId===b.id).forEach(it=>{
      rows.push([it.date, it.slot, it.who]);
    });
    if(rows.length > 1){
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{wch:12},{wch:14},{wch:12}];
      XLSX.utils.book_append_sheet(wb, ws, `${b.zone}${b.name}`);
    }
  });

  const userMap = {};
  items.forEach(it=>{
    if(!userMap[it.who]) userMap[it.who] = [];
    userMap[it.who].push(it);
  });

  const userRows = [['预约人','预约次数','最近预约日期']];
  Object.entries(userMap).sort((a,b)=>b[1].length-a[1].length).forEach(([user,list])=>{
    const latestDate = list.map(i=>i.date).sort().reverse()[0];
    userRows.push([user, list.length, latestDate]);
  });

  const wsUser = XLSX.utils.aoa_to_sheet(userRows);
  wsUser['!cols'] = [{wch:14},{wch:10},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsUser, '用户汇总');

  XLSX.writeFile(wb, `细胞房预约记录_${getTodayStr()}.xlsx`);
  showToast('📥 Excel 导出成功');
}

(async function init(){
  const savedName = localStorage.getItem('cell_booking_username');
  if(savedName) document.getElementById('username').value = savedName;

  await load();
  renderGrid();
})();
</script>
