<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>细胞房预约系统</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f8f7f4;--surface:#fff;--surface2:#f2f0ec;--border:#e0ddd7;
  --text:#1a1916;--text2:#6b6860;--text3:#9e9b95;
  --blue:#2563eb;--blue-light:#dbeafe;--green:#16a34a;--green-light:#dcfce7;
  --red:#dc2626;--red-light:#fee2e2;--amber:#d97706;--amber-light:#fef3c7;
  --radius:10px;--radius-lg:16px;--shadow:0 1px 4px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text)}
.layout{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:22px 14px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh}
.logo{display:flex;gap:10px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:8px}
.logo-icon{width:36px;height:36px;border-radius:10px;background:var(--blue);display:flex;align-items:center;justify-content:center;color:white}
.logo-text{font-size:15px;font-weight:700}.logo-text span{display:block;font-size:12px;font-weight:400;color:var(--text2)}
.nav-btn{border:0;background:transparent;border-radius:10px;padding:10px 12px;text-align:left;font-size:14px;color:var(--text2);cursor:pointer}
.nav-btn.active{background:var(--blue-light);color:var(--blue);font-weight:700}
.name-section{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
.name-label{font-size:12px;color:var(--text3);margin-bottom:6px}
.name-input,.form-input,.filter-select,.zone-select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:14px;outline:none}
.name-input:focus,.form-input:focus,.filter-select:focus,.zone-select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.main{flex:1;padding:26px;overflow-x:hidden}
.section{display:none}.section.visible{display:block}
.page-title{font-size:22px;font-weight:800;margin-bottom:6px}.page-sub{font-size:14px;color:var(--text2);margin-bottom:18px}
.top-form{background:white;border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.top-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.top-form label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.date-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.date-btn,.btn{padding:9px 15px;border:1px solid var(--border);border-radius:10px;background:white;color:var(--text);font-size:14px;cursor:pointer}
.date-btn:disabled{opacity:.4;cursor:not-allowed}.date-display{font-size:18px;font-weight:800}.date-tag{background:var(--blue-light);color:var(--blue);border-radius:999px;padding:4px 10px;font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 16px}.legend-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2)}.lg{width:17px;height:17px;border-radius:5px}
.notice{background:white;border:1px solid var(--border);border-radius:16px;padding:26px;text-align:center;color:var(--text2);box-shadow:var(--shadow);margin-top:14px}
.notice .big{font-size:34px;margin-bottom:8px}.notice b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.mobile-book-wrap{display:flex;flex-direction:column;gap:14px}
.bench-card{background:white;border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.bench-title{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:800;margin-bottom:12px}
.bench-title em{font-style:normal;font-size:13px;color:var(--text2);background:var(--surface2);padding:3px 10px;border-radius:999px}
.slot-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.slot-btn{width:100%;min-height:58px;border:0;border-radius:12px;padding:8px 6px;font-size:14px;line-height:1.45;cursor:pointer}
.slot-free{background:var(--surface2);color:var(--text)}
.slot-free:hover{background:var(--blue-light);color:var(--blue)}
.slot-mine{background:var(--blue-light);color:var(--blue);font-weight:800}
.slot-taken{background:var(--surface2);color:var(--text3);opacity:.75;cursor:not-allowed;word-break:break-all}
.slot-conflict{background:var(--amber-light);color:var(--amber);cursor:not-allowed}
.card{background:white;border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}
.card-date{font-weight:800;margin-right:8px}.card-meta{font-size:13px;color:var(--text2)}
.cancel-btn{padding:6px 12px;border:1px solid var(--red);border-radius:10px;color:var(--red);background:white;font-size:13px;cursor:pointer}
.cancel-btn:hover{background:var(--red-light)}
.login-box{max-width:360px;background:white;border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.form-group{margin:14px 0}.form-label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:16px}.stat-card{background:white;border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow)}.stat-val{font-size:28px;font-weight:900}.stat-label{font-size:13px;color:var(--text2)}
.admin-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.filter-row{display:flex;gap:8px;flex-wrap:wrap}.filter-select{width:auto}
.admin-table-wrap{overflow-x:auto;background:white;border:1px solid var(--border);border-radius:16px;margin-bottom:16px}.admin-table{width:100%;border-collapse:collapse;font-size:14px;min-width:580px}.admin-table th{background:var(--surface2);text-align:left;padding:11px;border-bottom:1px solid var(--border)}.admin-table td{padding:10px;border-bottom:1px solid var(--border)}
.btn-primary{background:var(--blue);color:white;border-color:var(--blue)}.btn-green{background:var(--green);color:white;border-color:var(--green)}
.toast{position:fixed;right:20px;bottom:20px;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:700;display:none;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.toast-success{background:var(--green-light);color:var(--green);border:1px solid #86efac}.toast-error{background:var(--red-light);color:var(--red);border:1px solid #fca5a5}
.empty{text-align:center;padding:35px;color:var(--text3)}
.small-title{font-size:18px;font-weight:800;margin:18px 0 10px}
@media(min-width:900px){.slot-list{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){
  .layout{display:block}.sidebar{width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--border);padding:16px;gap:8px}
  .logo{border-bottom:0;margin-bottom:2px;padding-bottom:6px}.nav-btn{display:inline-block;width:31%;text-align:center}.name-section{display:none}
  .main{padding:18px 16px}.page-title{font-size:22px}.date-display{font-size:18px}.slot-list{grid-template-columns:repeat(2,1fr)}
  .slot-btn{min-height:56px;font-size:14px}.date-bar{gap:8px}.date-btn{padding:9px 13px}.filter-select{width:100%}
  .top-form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar">
    <div class="logo"><div class="logo-icon">🧫</div><div class="logo-text">细胞房预约<span>Cell Bench Booking</span></div></div>
    <button class="nav-btn active" onclick="switchTab('book')" id="nav-book">📅 预约</button>
    <button class="nav-btn" onclick="switchTab('mine')" id="nav-mine">📋 我的</button>
    <button class="nav-btn" onclick="switchTab('admin')" id="nav-admin">🔐 管理</button>
    <div class="name-section">
      <div class="name-label">当前用户</div>
      <input class="name-input" id="username-side" type="text" placeholder="请输入您的姓名" oninput="syncNameFromSide()" />
    </div>
  </nav>
  <main class="main">
    <section class="section visible" id="sec-book">
      <div class="page-title">预约细胞台</div>
      <div class="page-sub">请先输入姓名并选择区域，再查看对应台位的可预约时间段</div>

      <div class="top-form">
        <div class="top-form-grid">
          <div>
            <label>姓名</label>
            <input class="name-input" id="username" type="text" placeholder="请输入您的姓名" oninput="onNameChange()" />
          </div>
          <div>
            <label>区域</label>
            <select class="zone-select" id="zone-select" onchange="onZoneChange()">
              <option value="">请选择东区/西区</option>
              <option value="东区">东区</option>
              <option value="西区">西区</option>
            </select>
          </div>
        </div>
      </div>

      <div class="date-bar">
        <button class="date-btn" id="prev-btn" onclick="changeDay(-1)">‹ 前一天</button>
        <span class="date-display" id="date-label"></span><span class="date-tag" id="date-tag"></span>
        <button class="date-btn" id="next-btn" onclick="changeDay(1)">后一天 ›</button>
        <button class="date-btn" onclick="manualRefresh()">刷新</button>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="lg" style="background:#f2f0ec;border:1px solid #d4d2cc"></div>空闲</div>
        <div class="legend-item"><div class="lg" style="background:#dbeafe;border:1px solid #93c5fd"></div>我的预约</div>
        <div class="legend-item"><div class="lg" style="background:#f2f0ec;opacity:.55;border:1px dashed #d4d2cc"></div>他人预约</div>
        <div class="legend-item"><div class="lg" style="background:#fef3c7;border:1px solid #fcd34d"></div>时段冲突</div>
      </div>
      <div id="grid"></div>
    </section>

    <section class="section" id="sec-mine">
      <div class="page-title">我的预约</div><div class="page-sub">显示您未来的预约记录</div>
      <div id="my-list"></div>
    </section>

    <section class="section" id="sec-admin">
      <div class="page-title">管理员面板</div><div class="page-sub">查看、筛选、取消预约，并导出 Excel。取消操作会永久写入操作日志。</div>
      <div id="admin-login-box" class="login-box">
        <h3>🔐 管理员登录</h3>
        <div class="form-group"><label class="form-label">密码</label><input class="form-input" id="admin-pass" type="password" placeholder="请输入管理员密码" onkeydown="if(event.key==='Enter')adminLogin()" /></div>
        <button class="btn btn-primary" onclick="adminLogin()">登录</button>
      </div>
      <div id="admin-panel" style="display:none">
        <div class="stats-grid" id="stats-grid"></div>
        <div class="admin-toolbar">
          <div class="filter-row">
            <select class="filter-select" id="filter-date" onchange="renderAdminTable()"><option value="">全部日期</option></select>
            <select class="filter-select" id="filter-bench" onchange="renderAdminTable()"><option value="">全部台位</option></select>
            <select class="filter-select" id="filter-user" onchange="renderAdminTable()"><option value="">全部用户</option></select>
          </div>
          <input class="filter-select" id="export-start" type="date" title="导出开始日期" />
          <input class="filter-select" id="export-end" type="date" title="导出结束日期" />
          <button class="btn btn-green" onclick="exportExcel()">📥 导出 Excel</button>
          <button class="btn" onclick="setExportThisMonth()">本月</button>
          <button class="btn" onclick="clearExportRange()">全部</button>
          <button class="btn" onclick="manualRefresh()">刷新</button>
          <button class="btn" onclick="adminLogout()">退出</button>
        </div>
        <div class="small-title">当前预约记录</div>
        <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>日期</th><th>时间段</th><th>区域</th><th>台位</th><th>预约人</th><th>操作</th></tr></thead><tbody id="admin-tbody"></tbody></table></div>
        <div class="small-title">最近操作日志</div>
        <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>操作时间</th><th>操作类型</th><th>日期</th><th>时间段</th><th>台位</th><th>预约人</th><th>操作者</th></tr></thead><tbody id="log-tbody"></tbody></table></div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const JSONBIN_BIN_ID = '6a2007e3da38895dfe805a3f';
const JSONBIN_API_KEY = '$2a$10$PtHRo4NP.VHJFlMzK6St0Ok2yvRYIcBaPCP.kaHA7fopkzGKHEbIK';
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

const ADMIN_PASSWORD = 'admin888';
const MAX_AHEAD_DAYS = 3;
const BENCHES = [
  {id:'E1',name:'东区1号',zone:'东区'},{id:'E2',name:'东区2号',zone:'东区'},
  {id:'W1',name:'西区1号',zone:'西区'},{id:'W2',name:'西区2号',zone:'西区'},
  {id:'W3',name:'西区3号',zone:'西区'},{id:'W4',name:'西区4号',zone:'西区'}
];

function buildTimeSlots(){
  const slots = [];
  for(let h = 6; h < 24; h++){
    const h1 = String(h).padStart(2,'0');
    const h2 = String(h + 1).padStart(2,'0');
    slots.push(`${h1}:00-${h1}:30`);
    slots.push(`${h1}:30-${h2}:00`);
  }
  return slots;
}
const TIME_SLOTS = buildTimeSlots();

let currentOffset=0, bookings={}, actionLogs=[], adminLogged=false, isSaving=false;
const DAY_TAGS=['今天','明天','后天','大后天'];

function getDateStr(offset){const d=new Date();d.setDate(d.getDate()+offset);return d.toISOString().slice(0,10)}
function getTodayStr(){return getDateStr(0)}
function getNowText(){const d=new Date();return d.toLocaleString('zh-CN',{hour12:false})}
function getUser(){return document.getElementById('username').value.trim()}
function getZone(){return document.getElementById('zone-select').value}
function showToast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className=`toast toast-${type}`;t.style.display='block';clearTimeout(t._tid);t._tid=setTimeout(()=>t.style.display='none',2600)}
function cleanOldBookings(){const today=getTodayStr();Object.keys(bookings).forEach(d=>{if(d<today)delete bookings[d]})}
function benchName(benchId){const b=BENCHES.find(x=>x.id===benchId);return b?`${b.zone} ${b.name}`:benchId}
function addLog(action,dateStr,slot,benchId,bookedUser,operator){
  actionLogs.push({time:getNowText(),action,date:dateStr,slot,benchId,bench:benchName(benchId),bookedUser:bookedUser||'',operator:operator||''});
}

async function load(){
  try{
    const res=await fetch(`${JSONBIN_URL}/latest`,{headers:{'X-Master-Key':JSONBIN_API_KEY}});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    bookings=data.record?.bookings||{};
    actionLogs=data.record?.actionLogs||[];
    cleanOldBookings();
  }catch(e){console.error(e);bookings={};actionLogs=[];showToast('云端数据读取失败，请检查网络或Key','error')}
}
async function save(){
  if(isSaving)return; isSaving=true;
  try{
    cleanOldBookings();
    const res=await fetch(JSONBIN_URL,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_API_KEY},body:JSON.stringify({bookings,actionLogs,updatedAt:new Date().toISOString()})});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
  }catch(e){console.error(e);showToast('云端保存失败，请稍后重试','error')}
  finally{isSaving=false}
}
async function manualRefresh(){await load();renderGrid();renderMine();if(adminLogged)renderAdminPanel();showToast('已刷新')}

function switchTab(name){
  ['book','mine','admin'].forEach(n=>{document.getElementById('sec-'+n).classList.toggle('visible',n===name);document.getElementById('nav-'+n).classList.toggle('active',n===name)});
  if(name==='mine')renderMine(); if(name==='admin')renderAdminIfLogged();
}
function onNameChange(){
  const user = getUser();
  const side = document.getElementById('username-side');
  if(side) side.value = user;
  localStorage.setItem('cell_booking_username',user);
  renderGrid();renderMine();
}
function syncNameFromSide(){
  const v = document.getElementById('username-side').value.trim();
  document.getElementById('username').value = v;
  localStorage.setItem('cell_booking_username',v);
  renderGrid();renderMine();
}
function onZoneChange(){
  localStorage.setItem('cell_booking_zone', getZone());
  renderGrid();
}
function changeDay(d){const n=currentOffset+d;if(n<0||n>MAX_AHEAD_DAYS)return;currentOffset=n;renderGrid()}
function checkConflict(dateStr,slot,skipBenchId,user){
  const day=bookings[dateStr]||{};
  for(const b of BENCHES){
    if(b.id!==skipBenchId && day[`${b.id}__${slot}`]===user) return b.name;
  }
  return null;
}

async function book(dateStr,slot,benchId){
  const user=getUser(); if(!user){showToast('请先输入姓名','error');return}
  const zone=getZone(); if(!zone){showToast('请先选择东区或西区','error');return}
  await load();
  if(!bookings[dateStr])bookings[dateStr]={};
  const key=`${benchId}__${slot}`;
  if(bookings[dateStr][key]){showToast('该时段已被预约','error');renderGrid();return}
  const conflict=checkConflict(dateStr,slot,benchId,user);
  if(conflict){showToast(`您在 ${slot} 已预约 ${conflict}，不能同一时段预约多台`,'error');renderGrid();return}
  bookings[dateStr][key]=user;
  addLog('预约',dateStr,slot,benchId,user,user);
  await save(); showToast('✅ 预约成功'); renderGrid(); renderMine();
}
async function cancel(dateStr,slot,benchId){
  const user=getUser(); await load();
  const key=`${benchId}__${slot}`;
  const originalUser = bookings[dateStr]?.[key];
  if(!originalUser || originalUser!==user){showToast('只能取消自己的预约','error');renderGrid();return}
  delete bookings[dateStr][key];
  addLog('用户取消',dateStr,slot,benchId,originalUser,user);
  await save(); showToast('已取消预约，操作已记录'); renderGrid(); renderMine(); if(adminLogged)renderAdminTable();
}
async function adminCancel(dateStr,benchId,slot){
  if(!confirm(`确定取消 ${dateStr} ${slot} ${benchName(benchId)} 的预约？取消操作会写入日志。`))return;
  await load();
  const key=`${benchId}__${slot}`;
  const originalUser = bookings[dateStr]?.[key] || '';
  if(bookings[dateStr])delete bookings[dateStr][key];
  addLog('管理员取消',dateStr,slot,benchId,originalUser,'管理员');
  await save(); showToast('管理员已取消，该操作已记录'); renderAdminPanel(); renderGrid();
}

function renderGrid(){
  const dateStr=getDateStr(currentOffset);
  document.getElementById('date-label').textContent=dateStr;
  document.getElementById('date-tag').textContent=DAY_TAGS[currentOffset]||'';
  document.getElementById('prev-btn').disabled=currentOffset<=0;
  document.getElementById('next-btn').disabled=currentOffset>=MAX_AHEAD_DAYS;

  const user=getUser();
  const zone=getZone();

  if(!user && !zone){
    document.getElementById('grid').innerHTML=`<div class="notice"><div class="big">👤</div><b>请先输入姓名并选择区域</b><div>完成后即可查看东区或西区台位的预约时间段。</div></div>`;
    return;
  }
  if(!user){
    document.getElementById('grid').innerHTML=`<div class="notice"><div class="big">👤</div><b>请先输入姓名</b><div>输入姓名后即可查看并预约 ${zone} 台位。</div></div>`;
    return;
  }
  if(!zone){
    document.getElementById('grid').innerHTML=`<div class="notice"><div class="big">📍</div><b>请先选择东区或西区</b><div>选择区域后只显示该区域的台位。</div></div>`;
    return;
  }

  const day=bookings[dateStr]||{};
  const benches = BENCHES.filter(b=>b.zone===zone);
  let html='<div class="mobile-book-wrap">';
  benches.forEach(b=>{
    html+=`<div class="bench-card"><div class="bench-title"><span>${b.name}</span><em>${b.zone}</em></div><div class="slot-list">`;
    TIME_SLOTS.forEach(slot=>{
      const key=`${b.id}__${slot}`, who=day[key];
      if(!who){
        const conflict=checkConflict(dateStr,slot,b.id,user);
        html+=conflict
          ? `<button class="slot-btn slot-conflict" disabled>${slot}<br>冲突</button>`
          : `<button class="slot-btn slot-free" onclick="book('${dateStr}','${slot}','${b.id}')">${slot}<br>预约</button>`;
      }else if(who===user){
        html+=`<button class="slot-btn slot-mine" onclick="cancel('${dateStr}','${slot}','${b.id}')">${slot}<br>我的预约</button>`;
      }else{
        html+=`<button class="slot-btn slot-taken" disabled title="${who}">${slot}<br>${who}</button>`;
      }
    });
    html+='</div></div>';
  });
  html+='</div>';
  document.getElementById('grid').innerHTML=html;
}

function renderMine(){
  const user=getUser(), box=document.getElementById('my-list');
  if(!user){box.innerHTML='<div class="notice"><div class="big">👤</div><b>请先输入姓名</b><div>输入后可查看您的预约。</div></div>';return}
  const today=getTodayStr(), items=[];
  for(const [date,dayData] of Object.entries(bookings)){
    if(date<today)continue;
    for(const [key,who] of Object.entries(dayData)){
      if(who===user){const [benchId,slot]=key.split('__');items.push({date,slot,benchId,bench:BENCHES.find(b=>b.id===benchId)})}
    }
  }
  items.sort((a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot));
  if(!items.length){box.innerHTML='<div class="empty">📭 暂无预约记录</div>';return}
  box.innerHTML=items.map(it=>`<div class="card"><div><span class="card-date">${it.date}</span><span class="card-meta">${it.slot} | ${it.bench?it.bench.zone+' '+it.bench.name:it.benchId}</span></div><button class="cancel-btn" onclick="cancel('${it.date}','${it.slot}','${it.benchId}')">取消</button></div>`).join('');
}

function adminLogin(){if(document.getElementById('admin-pass').value===ADMIN_PASSWORD){adminLogged=true;document.getElementById('admin-login-box').style.display='none';document.getElementById('admin-panel').style.display='block';renderAdminPanel()}else showToast('密码错误','error')}
function adminLogout(){adminLogged=false;document.getElementById('admin-login-box').style.display='block';document.getElementById('admin-panel').style.display='none';document.getElementById('admin-pass').value=''}
function renderAdminIfLogged(){if(adminLogged)renderAdminPanel()}
function getAllItems(){
  const items=[]; for(const [date,dayData] of Object.entries(bookings)){for(const [key,who] of Object.entries(dayData)){const [benchId,slot]=key.split('__');items.push({date,slot,benchId,bench:BENCHES.find(b=>b.id===benchId),who})}}
  return items.sort((a,b)=>(a.date+a.slot).localeCompare(b.date+b.slot));
}
function renderAdminPanel(){
  const all=getAllItems(),today=getTodayStr(),future=all.filter(i=>i.date>=today).length,users=[...new Set(all.map(i=>i.who))];
  const bc={}; all.forEach(i=>{const n=i.bench?.name||i.benchId;bc[n]=(bc[n]||0)+1}); const top=Object.entries(bc).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('stats-grid').innerHTML=`<div class="stat-card"><div class="stat-val">${all.length}</div><div class="stat-label">总预约次数</div></div><div class="stat-card"><div class="stat-val">${users.length}</div><div class="stat-label">预约人数</div></div><div class="stat-card"><div class="stat-val">${future}</div><div class="stat-label">未来预约数</div></div><div class="stat-card"><div class="stat-val" style="font-size:18px">${top?top[0]:'—'}</div><div class="stat-label">最热门台位 ${top?top[1]:0}次</div></div>`;
  const fd=document.getElementById('filter-date'),fu=document.getElementById('filter-user'),fb=document.getElementById('filter-bench');
  const cd=fd.value,cu=fu.value,cb=fb.value;
  fd.innerHTML='<option value="">全部日期</option>'+[...new Set(all.map(i=>i.date))].sort().map(d=>`<option value="${d}" ${d===cd?'selected':''}>${d}</option>`).join('');
  fu.innerHTML='<option value="">全部用户</option>'+[...new Set(all.map(i=>i.who))].sort().map(u=>`<option value="${u}" ${u===cu?'selected':''}>${u}</option>`).join('');
  fb.innerHTML='<option value="">全部台位</option>'+BENCHES.map(b=>`<option value="${b.id}" ${b.id===cb?'selected':''}>${b.zone} ${b.name}</option>`).join('');
  renderAdminTable();
  renderLogTable();
}
function renderAdminTable(){
  const fd=document.getElementById('filter-date').value,fu=document.getElementById('filter-user').value,fb=document.getElementById('filter-bench').value;
  let items=getAllItems(); if(fd)items=items.filter(i=>i.date===fd); if(fu)items=items.filter(i=>i.who===fu); if(fb)items=items.filter(i=>i.benchId===fb);
  const tb=document.getElementById('admin-tbody');
  if(!items.length){tb.innerHTML='<tr><td colspan="6" class="empty">暂无预约记录</td></tr>';return}
  tb.innerHTML=items.map(it=>`<tr><td>${it.date}</td><td>${it.slot}</td><td>${it.bench?.zone||''}</td><td>${it.bench?.name||it.benchId}</td><td>${it.who}</td><td><button class="cancel-btn" onclick="adminCancel('${it.date}','${it.benchId}','${it.slot}')">取消</button></td></tr>`).join('');
}
function renderLogTable(){
  const tb=document.getElementById('log-tbody');
  const logs=[...actionLogs].reverse().slice(0,100);
  if(!logs.length){tb.innerHTML='<tr><td colspan="7" class="empty">暂无操作日志</td></tr>';return}
  tb.innerHTML=logs.map(l=>`<tr><td>${l.time||''}</td><td>${l.action||''}</td><td>${l.date||''}</td><td>${l.slot||''}</td><td>${l.bench||l.benchId||''}</td><td>${l.bookedUser||''}</td><td>${l.operator||''}</td></tr>`).join('');
}
function getExportRange(){
  const start = document.getElementById('export-start')?.value || '';
  const end = document.getElementById('export-end')?.value || '';
  if(start && end && start > end){
    showToast('导出开始日期不能晚于结束日期','error');
    return null;
  }
  return {start,end};
}
function inDateRange(date, range){
  if(!range) return false;
  if(range.start && date < range.start) return false;
  if(range.end && date > range.end) return false;
  return true;
}
function setExportThisMonth(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const first = `${y}-${m}-01`;
  const lastDate = new Date(y, d.getMonth()+1, 0).getDate();
  const last = `${y}-${m}-${String(lastDate).padStart(2,'0')}`;
  document.getElementById('export-start').value = first;
  document.getElementById('export-end').value = last;
  showToast('已设置为本月导出范围');
}
function clearExportRange(){
  document.getElementById('export-start').value = '';
  document.getElementById('export-end').value = '';
  showToast('已设置为导出全部日期');
}
function exportExcel(){
  const range = getExportRange();
  if(!range) return;

  const items = getAllItems().filter(it => inDateRange(it.date, range));
  const logs = actionLogs.filter(l => inDateRange(l.date || '', range));

  if(!items.length && !logs.length){
    showToast('该日期范围内暂无预约或操作日志','error');
    return;
  }

  const wb=XLSX.utils.book_new();

  const rangeText = range.start || range.end ? `${range.start || '最早'}_至_${range.end || '最晚'}` : '全部日期';

  const infoRows = [
    ['导出范围', rangeText],
    ['导出时间', getNowText()],
    ['当前预约记录数', items.length],
    ['操作日志记录数', logs.length]
  ];
  const wsInfo = XLSX.utils.aoa_to_sheet(infoRows);
  wsInfo['!cols'] = [{wch:18},{wch:28}];
  XLSX.utils.book_append_sheet(wb, wsInfo, '导出说明');

  const rows=[['日期','时间段','区域','台位','预约人']];
  items.forEach(it=>rows.push([it.date,it.slot,it.bench?.zone||'',it.bench?.name||it.benchId,it.who]));
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:12},{wch:14},{wch:8},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb,ws,'当前预约');

  const logRows=[['操作时间','操作类型','日期','时间段','台位','预约人','操作者']];
  logs.forEach(l=>logRows.push([l.time||'',l.action||'',l.date||'',l.slot||'',l.bench||l.benchId||'',l.bookedUser||'',l.operator||'']));
  const wsLog=XLSX.utils.aoa_to_sheet(logRows);
  wsLog['!cols']=[{wch:20},{wch:12},{wch:12},{wch:14},{wch:16},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb,wsLog,'操作日志');

  BENCHES.forEach(b=>{
    const r=[['日期','时间段','预约人']];
    items.filter(i=>i.benchId===b.id).forEach(i=>r.push([i.date,i.slot,i.who]));
    if(r.length>1){
      const s=XLSX.utils.aoa_to_sheet(r);
      s['!cols']=[{wch:12},{wch:14},{wch:12}];
      XLSX.utils.book_append_sheet(wb,s,`${b.zone}${b.name}`);
    }
  });

  const safeRangeText = rangeText.replace(/[\\/:*?"<>|]/g,'-');
  XLSX.writeFile(wb,`细胞房预约记录_${safeRangeText}.xlsx`);
  showToast('Excel导出成功');
}
(async function init(){
  const saved=localStorage.getItem('cell_booking_username');
  if(saved){
    document.getElementById('username').value=saved;
    const side=document.getElementById('username-side');
    if(side) side.value=saved;
  }
  const savedZone=localStorage.getItem('cell_booking_zone');
  if(savedZone) document.getElementById('zone-select').value=savedZone;
  await load(); renderGrid();
})();
</script>
